        <pattern id="wave1" width="400" height="140" patternUnits="userSpaceOnUse">

        </pattern>
      </defs>

     
      <rect width="250vw" height="140" fill="url(#wave1)" />
      <rect width="250vw" height="140" fill="url(#wave2)" />
      <rect width="250vw" height="140" fill="url(#wave3)" />
