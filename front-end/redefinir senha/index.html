<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="pagina-formulario">
    <meu-menu></meu-menu>
    <div class="form-box">
        <form>
            <h2>Alterar Senha</h2>
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="E-mail">
            </div>
            <div class="input-group">
                <label for="Vcode">Código de Verificação:</label>
                <input type="text" id="Vcode" placeholder="Código de Verificação">
            </div>
            <div class="input-group">
                <label for="nova-senha">Nova Senha:</label>
                <input type="password" id="nova-senha" placeholder="Nova Senha">
            </div>
            <div class="input-group">
                <label for="confirmar-senha">Confirmar Senha:</label>
                <input type="password" id="confirmar-senha" placeholder="Confirmar Senha">
            </div>
            <button class="btn">Alterar Senha</button>
        </form>
    </div>
    <alerta-mensagem></alerta-mensagem>
    <script src="../../back-end/scripts.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
