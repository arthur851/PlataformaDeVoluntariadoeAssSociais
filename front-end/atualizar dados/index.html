<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Dados</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="pagina-formulario">
    <meu-menu></meu-menu>
    <form class="form-box">
        <h2>Atualizar Dados</h2>
        <div class="input-duplo">
            <div class="input-image input-group">
                <input type="file" placeholder="Foto de perfil" accept="image/*" id="Foto">
                <label for="Foto" class="botao-upload">
                    Selecionar imagem
                </label>
            </div>
            <div class="input-group">
                <label for="nome"> Nome: </label>
                <input type="text" id="nome" placeholder="Nome">
            </div>
        </div>
        <div class="input-duplo">
            <div class="input-group">
                <label for="email"> Email: </label>
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="input-group">
                <label for="confirmar-email"> Confirmar Email: </label>
                <input type="email" id="confirmar-email" placeholder="Confirmar Email">
            </div>
        </div>
        <div class = "input-duplo">
            <div class="input-group">
                <label for="cpf"> CPF: </label>
                <input type="text" id="cpf" placeholder="CPF">
            </div>
            <div class="input-group">
                <label for="telefone"> Telefone: </label>
                <input type="tel" id="telefone" placeholder="Telefone">
            </div>
        </div>
        <div class="input-duplo">
            <div class="input-group">
                <label for="senha"> Senha: </label>
                <input type="password" id="senha" placeholder="Senha">
            </div>
            <div class="input-group">
                <label for="confirmar-senha"> Confirmar Senha: </label>
                <input type="password" id="confirmar-senha" placeholder="Confirmar Senha">
            </div>
        </div>
        <button class="btn">Atualizar</button>
    </form>
    <script src="../../back-end/scripts.js"></script>
    <script src="script.js"></script>
</body>
</html>
